name: ICT 5 Models Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: xauusd-ict-models
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ICT Models Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENVIRONMENT: "practice"
          AUTO_TRADE_ENABLED: "true"
          TRADE_UNITS: "10"
        run: python ict_scanner.py --once

      - name: Persist ICT State
        if: always()
        run: |
          if [ -f ict_models_state.json ]; then
            git config user.name "xauusd-scanner-bot"
            git config user.email "actions@users.noreply.github.com"
            git add ict_models_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update ICT models state [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
