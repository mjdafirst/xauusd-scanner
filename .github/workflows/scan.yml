name: XAUUSD Scanner

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this by a few minutes during
    # high load — that's normal for free scheduled workflows.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Needed so the workflow can commit scanner and learning state back to the repo.
permissions:
  contents: write

# Prevents overlapping runs from racing to commit state files.
concurrency:
  group: xauusd-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STRATEGY_MODE: ${{ secrets.STRATEGY_MODE }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENVIRONMENT: "practice"
          AUTO_TRADE_ENABLED: "true"
          TRADE_UNITS: "10"
          USE_RISK_BASED_SIZING: "false"
          RISK_PER_TRADE_PERCENT: "1.0"
        run: python scanner.py --once

      - name: Persist scanner and learning state
        run: |
          git config user.name "xauusd-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json learning_state.json champion_strategy.json
          git diff --cached --quiet || git commit -m "Update scanner and learning state [skip ci]"
          git push
