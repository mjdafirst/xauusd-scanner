name: XAUUSD Scanner

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this by a few minutes during
    # high load — that's normal for free scheduled workflows.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

# Needed so the workflow can commit the updated state.json file back to the
# repo (this is what makes the alert cooldown persist between runs).
permissions:
  contents: write

# Prevents two runs from overlapping and racing to commit state.json if a
# scan ever takes longer than 15 minutes (shouldn't normally happen).
concurrency:
  group: xauusd-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          # Practice by default. Change to "live" only if you deliberately
          # intend to trade a funded account (see README safety notes).
          OANDA_ENVIRONMENT: "practice"
          # Master switch — the scanner will place real (demo) trades now.
          AUTO_TRADE_ENABLED: "true"
          TRADE_UNITS: "10"
          USE_RISK_BASED_SIZING: "false"
          RISK_PER_TRADE_PERCENT: "1.0"
        run: python scanner.py --once

      - name: Persist scanner state
        run: |
          git config user.name "xauusd-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update scanner state [skip ci]"
          git push
