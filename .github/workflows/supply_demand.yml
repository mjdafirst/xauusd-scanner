name: Supply Demand Scanner
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: xauusd-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Scan supply demand
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENVIRONMENT: practice
          AUTO_TRADE_ENABLED: 'false'
          ALLOW_LIVE_TRADING: 'false'
          TRADE_UNITS: '10'
          STRATEGY_CONFIG_FILE: sd_champion_unused.json
        run: python -u supply_demand_scanner.py
      - name: Persist independent zone state
        if: always()
        run: |
          if [ -f sd_state.json ]; then
            git config user.name xauusd-scanner-bot
            git config user.email actions@users.noreply.github.com
            git add sd_state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update supply demand zone state [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
