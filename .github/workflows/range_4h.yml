name: 4H Range Scanner

on:
  schedule:
    # Runs every 15 minutes during active market hours
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Distinct concurrency group so it runs independently in parallel with the main scanner
concurrency:
  group: xauusd-4h-range
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 4H Range Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENVIRONMENT: "practice"
          AUTO_TRADE_ENABLED: "false"
          TRADE_UNITS: "10"
        run: python range_4h_scanner.py --once

      - name: Persist 4H Range State
        if: always()
        run: |
          if [ -f range_4h_state.json ]; then
            git config user.name "xauusd-scanner-bot"
            git config user.email "actions@users.noreply.github.com"
            git add range_4h_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update 4H range scanner state [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
